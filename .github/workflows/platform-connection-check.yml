name: Platform Connection Check

# Refreshes what can be refreshed (TikTok every run: 24 h access tokens, rotated refresh token; Instagram /
# Threads long-lived tokens) and saves new tokens back to THIS repo's secrets with GH_PAT. Then checks TikTok,
# YouTube, Instagram (and Threads / Facebook only if their secrets exist). Prints PASS / FAIL / not configured
# with the account name. Never prints a token. Posts nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiktok-token
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh tokens, then check every platform
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python -m pipeline.social.check --out connection_check.json

      - name: Check second TikTok connection if configured
        env:
          TIKTOK_ACCOUNT: secondary
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN_2 }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$TIKTOK_REFRESH_TOKEN" ]; then
            echo "TikTok secondary: not connected"
          else
            python -c "from pipeline import tiktok_auth as t; d=t.access_token(); ids=t.video_list(d['access_token'], 5); print('TikTok secondary: PASS', t.username(d['access_token']), 'videos checked:', len(ids))"
          fi
