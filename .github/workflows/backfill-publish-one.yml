name: Backfill Publish (one)

# One publishing attempt per scheduled run. Shared 20-per-24-hour quota remains unchanged.
on:
  workflow_dispatch:
  schedule:
    - cron: '7,20,33,46,59 * * * *'

permissions:
  contents: write   # push the state branch

# One group for every job that touches TikTok tokens or the state branch.
concurrency:
  group: tiktok-token
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Ensure ffmpeg / ffprobe
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Check out the state branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin state 2>/dev/null; then
            git worktree add -q -B state .state origin/state
          else
            git worktree add -q --orphan -b state .state
            mkdir -p .state/state
            echo "State branch: created (first run)"
          fi
      - name: Refresh TikTok token for reliable scheduled discovery
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python pipeline/tiktok_auth.py
      - name: Continue publishing loop
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python -m pipeline.publish_loop --state-dir .state --target 20 --max-posts 1 --segment-seconds 600
