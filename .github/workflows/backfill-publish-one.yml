name: Backfill Publish (one)

# Manual loop: check new TikToks every 5 minutes, old videos every 72 minutes.
# Consecutive hosted jobs resume one checkpointed loop, target 20 old source videos.
on:
  workflow_dispatch:

permissions:
  contents: write   # push the state branch

# One group for every job that touches TikTok tokens or the state branch.
concurrency:
  group: tiktok-token
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        segment: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Ensure ffmpeg / ffprobe
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Check out the state branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin state 2>/dev/null; then
            git worktree add -q -B state .state origin/state
          else
            git worktree add -q --orphan -b state .state
            mkdir -p .state/state
            echo "State branch: created (first run)"
          fi
      - name: Refresh TikTok token for reliable scheduled discovery
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python pipeline/tiktok_auth.py
      - name: Continue publishing loop
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python -m pipeline.publish_loop --state-dir .state --target 20

  finish:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm the loop has ended
        run: |
          git fetch -q origin state
          git worktree add -q -B state .state origin/state
          python -m pipeline.publish_loop --state-dir .state --verify-only
