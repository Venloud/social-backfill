name: Publisher Queue Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/publish_one.py"
      - "pipeline/manifest.py"
      - "tests/test_publish_queue.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run independent queue regression tests
        run: python -m unittest -v tests.test_publish_queue
