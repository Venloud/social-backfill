<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Social Drop</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drop">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0e0f12">
<style>
  :root { --bg:#0e0f12; --card:#17191e; --line:#2a2d35; --text:#f2f3f5; --mute:#9aa0ab; --accent:#d81f52; --ok:#3ecf8e; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:520px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:22px; margin:4px 0 2px; }
  .sub { color:var(--mute); font-size:14px; margin:0 0 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--mute); margin-bottom:6px; }
  input[type=password], textarea { width:100%; background:#0b0c0f; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px; font:inherit; }
  textarea { min-height:120px; resize:vertical; }
  .pick { display:flex; align-items:center; justify-content:center; min-height:150px; border:2px dashed var(--line); border-radius:12px; color:var(--mute); text-align:center; cursor:pointer; overflow:hidden; }
  .pick span { padding:12px 16px; }
  .pick video { width:100%; max-height:360px; display:block; background:#000; }
  #file { display:none; }
  .item { display:flex; gap:12px; padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid var(--line); }
  .item video { width:96px; height:170px; object-fit:cover; border-radius:10px; background:#000; flex:none; }
  .item .body { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .item textarea { flex:1; min-height:110px; }
  .item .top { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--mute); }
  .item .top .link { padding:0; }
  textarea.missing { border-color:var(--err); }
  li.drop { display:flex; gap:12px; align-items:flex-start; }
  li.drop video { width:64px; height:114px; object-fit:cover; border-radius:8px; background:#000; flex:none; }
  li.drop div { min-width:0; }
  li.drop .cap { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-line; }
  button { width:100%; border:0; border-radius:12px; padding:15px; font:600 17px/1 inherit; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.45; }
  .link { background:none; color:var(--mute); width:auto; padding:6px 0; font-size:13px; font-weight:400; text-decoration:underline; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:12px; display:none; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  #msg { margin-top:10px; font-size:14px; min-height:20px; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:9px 0; border-top:1px solid var(--line); font-size:14px; }
  li:first-child { border-top:0; }
  li small { color:var(--mute); display:block; }
  .install { border-color:var(--accent); }
  .install p { margin:0 0 12px; font-size:15px; }
  .install .row { display:flex; gap:10px; }
  .install .row button { flex:1; }
  .install .link { flex:0 0 auto; }
  .hint { font-size:12px; color:var(--mute); margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>Social Drop</h1>
  <p class="sub">Drop a video + caption. It posts to Instagram and YouTube next, ahead of the TikTok backfill.</p>

  <div class="card install" id="installCard" style="display:none">
    <p id="installText"></p>
    <div class="row"><button id="installBtn" style="display:none">Install app</button><button class="link" id="installLater">Not now</button></div>
  </div>

  <div class="card" id="unlockCard" style="display:none">
    <label for="pass">Passcode</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Passcode">
    <div style="margin-top:12px"><button id="unlock">Submit</button></div>
    <div id="unlockMsg" class="hint"></div>
  </div>

  <div class="card" id="tokenCard" style="display:none">
    <label for="token">Owner setup: GitHub token</label>
    <input id="token" type="password" autocomplete="off" placeholder="github_pat_…">
    <p class="hint">Fine-grained token → repository <b>Venloud/social-backfill</b> only → Contents: Read and write.</p>
    <div style="margin-top:12px"><button id="save">Submit</button></div>
    <div id="tokenMsg" class="hint"></div>
  </div>

  <div class="card" id="shareCard" style="display:none">
    <label for="shareLink">Send this link. Opening it is all they need.</label>
    <textarea id="shareLink" readonly style="min-height:90px;font-size:13px"></textarea>
    <div style="margin-top:12px"><button id="copy">Copy link</button></div>
  </div>
  <p id="saved" style="display:none"></p>

  <div class="card">
    <label>Video</label>
    <div id="list"></div>
    <div class="pick" id="pick"><span>Tap to choose videos</span></div>
    <input id="file" type="file" accept="video/*" multiple>
    <div style="margin-top:14px"><button id="push" disabled>Push</button></div>
    <div class="bar" id="bar"><i></i></div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <label>Recent drops</label>
    <ul id="recent"><li><small>Add your token to see drops.</small></li></ul>
    <button class="link" id="change">Owner setup</button>
  </div>
</main>
<script>
const REPO = "Venloud/social-backfill", BRANCH = "drops", API = "https://api.github.com/repos/" + REPO;
// The git blobs API answers 422 "input too large" for a 45 MB part (40 MB passed in a probe), so videos
// over 25 MB upload as ordered parts that the publisher rejoins. 250 MB stays under Instagram's 300 MB limit.
const PART_BYTES = 25 * 1024 * 1024, MAX_BYTES = 250 * 1024 * 1024;
const $ = id => document.getElementById(id);
let items = [];   // {file, cover, caption (textarea), el}

function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function say(text, cls) { $("msg").textContent = text; $("msg").className = cls || ""; }
function token() { return $("token").value.trim(); }
function ready() {
  $("push").disabled = !(items.length && token());
  items.forEach(i => i.caption.value.trim() && i.caption.classList.remove("missing"));
  $("push").textContent = items.length > 1 ? "Push " + items.length + " videos" : "Push";
  $("pick").firstElementChild.textContent = items.length ? "Tap to add more videos" : "Tap to choose videos";
  items.forEach((it, n) => it.el.querySelector(".num").textContent = "Video " + (n + 1));
}

async function gh(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { Authorization: "Bearer " + token(),
    Accept: "application/vnd.github+json", ...(opts.body ? { "Content-Type": "application/json" } : {}) } });
  if (!r.ok && r.status !== 404) throw new Error("GitHub " + r.status + ": " + ((await r.json().catch(() => ({}))).message || ""));
  return r.status === 404 ? null : r.json();
}

// Upload a file as a git blob. Base64 is built in 3 MB slices into a Blob body, so a big video never
// becomes one giant string in memory (that is what made pushes crawl on a full phone).
async function blob(file, onProgress) {
  const parts = ['{"encoding":"base64","content":"'], SLICE = 3 * 1024 * 1024;
  for (let i = 0; i < file.size; i += SLICE) {
    const bytes = new Uint8Array(await file.slice(i, i + SLICE).arrayBuffer());
    let bin = "";
    for (let j = 0; j < bytes.length; j += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(j, j + 0x8000));
    parts.push(btoa(bin));
  }
  parts.push('"}');
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", API + "/git/blobs");
    x.setRequestHeader("Authorization", "Bearer " + token());
    x.setRequestHeader("Accept", "application/vnd.github+json");
    x.setRequestHeader("Content-Type", "application/json");
    x.upload.onprogress = e => e.lengthComputable && onProgress && onProgress(e.loaded / e.total);
    x.onload = () => x.status < 300 ? resolve(JSON.parse(x.responseText).sha)
      : reject(new Error("GitHub " + x.status + ": " + (JSON.parse(x.responseText || "{}").message || "")));
    x.onerror = () => reject(new Error("The upload was cut off (weak signal or the video is too big)."));
    x.send(new Blob(parts, { type: "application/json" }));
  });
}

// One commit on the drops branch for the whole batch; retry if the branch moved meanwhile.
async function commitDrops(tree, count) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const head = (await gh("/git/ref/heads/" + BRANCH)).object.sha;
    const base = (await gh("/git/commits/" + head)).tree.sha;
    const t = await gh("/git/trees", { method: "POST", body: JSON.stringify({ base_tree: base, tree }) });
    const c = await gh("/git/commits", { method: "POST", body: JSON.stringify({
      message: "drop: " + count + " video" + (count > 1 ? "s" : ""), tree: t.sha, parents: [head] }) });
    try { return await gh("/git/refs/heads/" + BRANCH, { method: "PATCH", body: JSON.stringify({ sha: c.sha }) }); }
    catch (e) { if (attempt === 2) throw e; }
  }
}

const utf8b64 = s => btoa(unescape(encodeURIComponent(s)));

async function ensureBranch() {
  if (await gh("/branches/" + BRANCH)) return;
  const main = await gh("/git/ref/heads/main");
  await gh("/git/refs", { method: "POST", body: JSON.stringify({ ref: "refs/heads/" + BRANCH, sha: main.object.sha }) });
}

function grabCover(video) {
  return new Promise(res => {
    const seek = () => { video.currentTime = Math.min(1, (video.duration || 2) / 2); };
    video.addEventListener("seeked", () => {
      try {
        const c = document.createElement("canvas");
        c.width = video.videoWidth; c.height = video.videoHeight;
        c.getContext("2d").drawImage(video, 0, 0);
        c.toBlob(b => res(b), "image/jpeg", 0.9);
      } catch (e) { res(null); }
    }, { once: true });
    video.readyState >= 1 ? seek() : video.addEventListener("loadedmetadata", seek, { once: true });
    setTimeout(() => res(null), 8000);
  });
}

$("pick").onclick = () => $("file").click();
$("file").onchange = () => {
  const skipped = [];
  for (const file of $("file").files) {
    if (file.size > MAX_BYTES) { skipped.push(file.name + " (" + (file.size / 1048576).toFixed(0) + " MB)"); continue; }
    const el = document.createElement("div"); el.className = "item";
    el.innerHTML = '<video muted playsinline preload="auto"></video><div class="body">' +
      '<div class="top"><span class="num"></span><button class="link">Remove</button></div>' +
      '<textarea placeholder="Caption with #hashtags"></textarea></div>';
    // "#t=0.1" makes iPhone Safari draw the first frame instead of a black box; tap to play.
    const v = el.querySelector("video"); v.src = URL.createObjectURL(file) + "#t=0.1"; v.controls = true;
    const it = { file, cover: null, caption: el.querySelector("textarea"), el };
    it.caption.oninput = ready;
    el.querySelector(".link").onclick = () => { items = items.filter(x => x !== it); el.remove(); ready(); };
    grabCover(v).then(b => { it.cover = b; if (b) v.poster = URL.createObjectURL(b); });
    items.push(it); $("list").append(el);
  }
  $("file").value = "";
  say(skipped.length ? "Too big, skipped (limit 250 MB, try exporting at 1080p): " + skipped.join(", ") : "", skipped.length ? "err" : "");
  ready();
};
// The owner's token is stored in docs/key.json only encrypted with the shared passcode (PBKDF2 + AES-GCM).
const KEY_PATH = "docs/key.json", enc = new TextEncoder();
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function passKey(pass, salt) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
let lockedKey = null;

function view(which) {   // "unlock" | "setup" | "ready"
  $("unlockCard").style.display = which === "unlock" ? "" : "none";
  $("tokenCard").style.display = which === "setup" ? "" : "none";
  $("saved").style.display = which === "ready" ? "" : "none";
}
function fail(el, e) { $(el).textContent = e.message || String(e); $(el).className = "hint err"; }

$("unlock").onclick = async () => {
  $("unlockMsg").className = "hint"; $("unlockMsg").textContent = "Checking…";
  try {
    const key = await passKey($("pass").value, fromB64(lockedKey.salt));
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(lockedKey.iv) }, key, fromB64(lockedKey.data))
      .catch(() => { throw new Error("Wrong passcode."); });
    $("token").value = new TextDecoder().decode(plain);
    store("drop_token", token());
    $("pass").value = ""; $("unlockMsg").textContent = "";
    view("ready"); ready(); refresh();
  } catch (e) { fail("unlockMsg", e); }
};

$("save").onclick = async () => {
  $("tokenMsg").className = "hint"; $("tokenMsg").textContent = "Checking…";
  try {
    // A long random passcode goes in the share link's #fragment (never sent to any server).
    const pass = toB64(crypto.getRandomValues(new Uint8Array(18))).replace(/\+/g, "-").replace(/\//g, "_");
    const repo = token() && await gh("");
    if (!repo || !repo.permissions || !repo.permissions.push) throw new Error("This token can't write to Venloud/social-backfill.");
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await passKey(pass, salt), enc.encode(token()));
    lockedKey = { salt: toB64(salt), iv: toB64(iv), data: toB64(data) };
    const existing = await gh("/contents/" + KEY_PATH + "?ref=main");
    await gh("/contents/" + KEY_PATH, { method: "PUT", body: JSON.stringify({ message: "Drop page: update locked key",
      content: utf8b64(JSON.stringify(lockedKey)), branch: "main", ...(existing ? { sha: existing.sha } : {}) }) });
    store("drop_token", token());
    $("tokenMsg").textContent = "";
    view("ready"); ready(); refresh();
    $("shareLink").value = location.origin + location.pathname + "#p=" + pass;
    $("shareCard").style.display = "";
    say("Saved. The link works after GitHub updates the page (about 2 minutes).", "ok");
  } catch (e) { fail("tokenMsg", e); }
};
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("shareLink").value); $("copy").textContent = "Copied"; }
  catch (e) { $("shareLink").select(); }
};
$("change").onclick = () => view("setup");

$("push").onclick = async () => {
  // Every video needs a caption before anything uploads.
  const missing = items.map((it, n) => it.caption.value.trim() ? 0 : n + 1).filter(Boolean);
  if (missing.length) {
    items.forEach(it => it.caption.classList.toggle("missing", !it.caption.value.trim()));
    items.find(it => !it.caption.value.trim()).caption.focus();
    return say("Add a caption to video " + missing.join(", ") + ". Nothing was uploaded.", "err");
  }
  $("push").disabled = true; $("pick").style.pointerEvents = "none"; $("bar").style.display = "block";
  const bar = p => $("bar").firstElementChild.style.width = Math.round(p * 100) + "%";
  const batch = items.slice(), total = batch.length, start = Date.now();
  const sent = new Array(total).fill(0), sizes = batch.map(it => it.file.size);
  const progress = () => bar(0.02 + 0.93 * sent.reduce((a, b) => a + b, 0) / sizes.reduce((a, b) => a + b, 0));
  try {
    say("Preparing…"); bar(0.02);
    await ensureBranch();
    // Videos upload 2 at a time as git blobs; one commit at the end adds every drop at once,
    // so the publisher never sees half a drop. created_at keeps the picked order.
    const entries = [];
    let next = 0, finished = 0;
    const worker = async () => {
      while (next < total) {
        const n = next++, it = batch[n];
        const id = new Date(start).toISOString().replace(/[-:]/g, "").replace("T", "-").slice(0, 15) + "-" + String(n).padStart(2, "0") + Math.random().toString(36).slice(2, 5);
        const parts = Math.ceil(it.file.size / PART_BYTES);
        for (let k = 0; k < parts; k++) {
          const from = k * PART_BYTES, piece = it.file.slice(from, from + PART_BYTES);
          const sha = await blob(piece, p => { sent[n] = from + p * piece.size; progress(); });
          const name = parts > 1 ? id + ".part" + String(k).padStart(3, "0") + ".mp4" : id + ".mp4";
          entries.push({ path: "drops/" + name, mode: "100644", type: "blob", sha });
        }
        if (it.cover) entries.push({ path: "drops/" + id + ".jpg", mode: "100644", type: "blob", sha: await blob(it.cover) });
        entries.push({ path: "drops/" + id + ".json", mode: "100644", type: "blob",
          content: JSON.stringify({ caption: it.caption.value.trim(), created_at: new Date(start + n).toISOString(),
            ...(parts > 1 ? { parts } : {}) }, null, 2) });
        local[id] = URL.createObjectURL(it.file);   // play from the phone's copy, no re-download
        say("Uploaded " + (++finished) + " of " + total + "…");
      }
    };
    say(total > 1 ? "Uploading " + total + " videos…" : "Uploading…");
    await Promise.all([worker(), worker()]);
    say("Saving…");
    await commitDrops(entries, total);
    batch.forEach(it => it.el.remove()); items = items.filter(it => !batch.includes(it)); bar(1);
    say((total > 1 ? "All " + total + " queued" : "Queued") + ". They post one at a time (Instagram hourly, YouTube up to 4 per day).", "ok");
    refresh();
  } catch (e) {
    say("Didn't go through: " + e.message + " Nothing was queued. Press Push to retry.", "err");
  } finally {
    $("pick").style.pointerEvents = "";
    setTimeout(() => { $("bar").style.display = "none"; bar(0); }, 1500);
    ready();
  }
};

// GitHub serves .mp4 as octet-stream, so playback needs a typed blob. Cache one download per drop.
const local = {}, fetching = {};
function videoUrl(id, raw, files) {
  return fetching[id] || (fetching[id] = Promise.all(files.map(f => fetch(raw + f).then(r => r.arrayBuffer())))
    .then(bufs => local[id] = URL.createObjectURL(new Blob(bufs, { type: "video/mp4" }))));
}

async function refresh() {
  if (!token()) return;
  try {
    const items = (await gh("/contents/drops?ref=" + BRANCH)) || [];
    const ids = items.filter(i => i.name.endsWith(".json")).map(i => i.name.slice(0, -5)).sort().reverse().slice(0, 10);
    const names = new Set(items.map(i => i.name));
    const raw = "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/drops/";
    $("recent").replaceChildren(...(ids.length ? ids.map((id, n) => {
      const li = document.createElement("li"); li.className = "drop";
      // Tap the thumbnail to play. GitHub serves .mp4 as octet-stream, so load it as a typed blob first.
      const v = document.createElement("video");
      v.preload = "none"; v.playsInline = true;
      if (names.has(id + ".jpg")) v.poster = raw + id + ".jpg";
      // Instant: a video pushed from this phone plays from its local copy; the newest few prefetch.
      const files = names.has(id + ".mp4") ? [id + ".mp4"] : [...names].filter(f => f.startsWith(id + ".part")).sort();
      if (local[id]) { v.src = local[id]; v.controls = true; }
      else if (n < 3) videoUrl(id, raw, files).then(u => { if (!v.src) { v.src = u; v.controls = true; } }).catch(() => {});
      v.onclick = async () => {
        if (v.src) return;
        v.style.opacity = ".5";
        try { v.src = await videoUrl(id, raw, files); v.controls = true; v.play().catch(() => {}); }
        catch (e) {} finally { v.style.opacity = ""; }
      };
      const body = document.createElement("div");
      const cap = document.createElement("span"); cap.className = "cap"; cap.textContent = "…";
      const when = document.createElement("small");
      when.textContent = id.slice(0, 4) + "-" + id.slice(4, 6) + "-" + id.slice(6, 8) + " " + id.slice(9, 11) + ":" + id.slice(11, 13) + " UTC";
      body.append(cap, when); li.append(v, body);
      fetch(raw + id + ".json").then(r => r.json()).then(d => { cap.textContent = d.caption || "(no caption)"; })
        .catch(() => { cap.textContent = "drop-" + id; });
      return li;
    }) : [Object.assign(document.createElement("li"), { textContent: "No drops yet." })]));
  } catch (e) { $("recent").replaceChildren(Object.assign(document.createElement("li"), { textContent: e.message })); }
}

$("token").value = load("drop_token");
(async () => {
  try { const r = await fetch("key.json", { cache: "no-store" }); if (r.ok) lockedKey = await r.json(); } catch (e) {}
  const linkPass = new URLSearchParams(location.hash.slice(1)).get("p");
  view(token() ? "ready" : lockedKey ? "unlock" : "setup");
  if (!token() && lockedKey && linkPass) { $("pass").value = linkPass; $("unlock").click(); }   // share link: no typing
  ready(); refresh();
})();

// "Save as app" prompt on first visit. iPhone can't open the Add to Home Screen sheet for us, so point at Share.
let installEvent = null;
(() => {
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (standalone || load("install_dismissed")) return;
  const show = text => { $("installText").innerHTML = text; $("installCard").style.display = ""; };
  if (ios) {
    const shareIcon = '<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" style="vertical-align:-4px" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M8 10H6.5A1.5 1.5 0 0 0 5 11.5v8A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 17.5 10H16"/></svg>';
    const safari =/Safari/.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS|Instagram|FBAN|FBAV|GSA/.test(navigator.userAgent);
    show(safari
      ? "Save this as an app: tap <b>Share</b> " + shareIcon + " at the bottom → <b>View More</b> → <b>Add to Home Screen</b> <span aria-hidden=\"true\">⊕</span>."
      : "Open this link in <b>Safari</b>, then tap <b>Share</b> " + shareIcon + " → <b>View More</b> → <b>Add to Home Screen</b> <span aria-hidden=\"true\">⊕</span> to save it as an app.");
  }
  addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); installEvent = e;
    $("installBtn").style.display = "";
    show("Save this as an app on your phone.");
  });
})();
$("installBtn").onclick = async () => {
  if (!installEvent) return;
  installEvent.prompt();
  await installEvent.userChoice.catch(() => {});
  installEvent = null; $("installCard").style.display = "none";
};
$("installLater").onclick = () => { store("install_dismissed", "1"); $("installCard").style.display = "none"; };
addEventListener("appinstalled", () => { $("installCard").style.display = "none"; });
</script>
</body>
</html>
