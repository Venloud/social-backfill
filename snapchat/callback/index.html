<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snapchat OAuth Callback</title></head>
<body>
<h1>Snapchat authorization</h1>
<p id="status">Reading authorization response...</p>
<pre id="result"></pre>
<script>
const p=new URLSearchParams(window.location.search);
const code=p.get('code');
const error=p.get('error');
const status=document.getElementById('status');
const result=document.getElementById('result');
if(code){status.textContent='Authorization code received. Copy it now, then close this page.';result.textContent=code;}
else if(error){status.textContent='Authorization failed.';result.textContent=error;}
else{status.textContent='OAuth callback is ready.';}
</script>
</body>
</html>
